services:
  assistant:
    build: .
    ports: ["8080:8080"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_PATH: /data/chroma
    volumes: ["chroma:/data/chroma"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
volumes: {chroma: {}}
